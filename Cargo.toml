[workspace]
members = ["crates/wire", "crates/client"]
default-members = ["crates/wire", "crates/client"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
