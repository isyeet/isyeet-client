[package]
name = "isyeet-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "isyeet"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:reqwest", "dep:fs2", "dep:libc", "dep:url"]
device-linking = []

[dependencies]
isyeet-wire = { path = "../wire" }
# Signal upstream v0.103.0, immutable source pin (no substitute protocol).
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "ba133bd3457f556fbf56db0a5ab985de0af79da6" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
rand = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
url = { version = "2", optional = true }
